<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 
<style>
    /* ===== TABLET - 1024px down ===== */
@media(max-width:1024px){
  #index h1{font-size:44px}
  #about .wrap{grid-template-columns:1fr;gap:25px}
  #about img{height:320px}
  #gallery .grid{grid-template-columns:repeat(3,1fr)}
  #contact .wrap{grid-template-columns:1fr}
}

/* ===== MOBILE - 750px down ===== */
@media(max-width:750px){
  header{flex-wrap:wrap;padding:12px 4%}
  .logo{font-size:19px}
  nav{
    display:flex !important;
    width:100%;
    order:3;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    padding-top:10px;
    border-top:1px solid #333;
  }
  nav a{
    font-size:13px;
    background:#1a1a1a;
    padding:8px 12px;
    border-radius:20px;
    margin:0;
  }
  #index{padding:50px 4%}
  #index h1{font-size:32px}
  #index p{font-size:15px}
  #index .btns a{display:block;width:100%;margin:6px 0;text-align:center}
  #index .stats{flex-direction:column}
  #index .cars{grid-template-columns:1fr}
  #about{padding:45px 4%}
  #about h2{font-size:28px}
  #about .features{grid-template-columns:1fr}
  #gallery{padding:45px 4%}
  #gallery .grid{grid-template-columns:1fr 1fr}
  #gallery .grid img{height:150px}
  #gallery .grid img:nth-child(1){grid-column:span 2;height:190px}
  #gallery .head{flex-direction:column;align-items:flex-start}
  #contact{padding:45px 4%}
  #contact h2{font-size:28px}
  .whatsapp{bottom:15px;right:15px;padding:12px 16px;font-size:13px}
}

/* ===== SMALL PHONE - 480px down ===== */
@media(max-width:480px){
  #index h1{font-size:27px}
  #gallery .grid{grid-template-columns:1fr}
  #gallery .grid img:nth-child(1){grid-column:span 1}
}
            *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:white}
a{color:white;text-decoration:none}
header{background:#111;display:flex;justify-content:space-between;align-items:center;padding:18px 5%;position:sticky;top:0;z-index:100}
.logo{font-size:24px;font-weight:900}.logo span{color:#ffcc00}
nav a{margin:0 14px;font-weight:bold}nav a:hover{color:#ffcc00}
.btn{background:#ffcc00;color:black;padding:12px 22px;border-radius:30px;font-weight:bold;display:inline-block}
footer{background-color: blue;text-align:center;padding:25px;color:#aaa}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:14px 20px;border-radius:50px;font-weight:bold;box-shadow:0 5px 20px rgba(0,0,0,.5)}
@media(max-width:700px){nav{display:none}}
.gallery-section{padding:60px 5%}
.gallery-section h2{font-size:32px;margin-bottom:10px}.gallery-section h2 span{color:#ffcc00}
.gallery-section p.sub{color:#bbb;margin-bottom:30px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.gallery-grid img{width:100%;height:200px;object-fit:cover;border-radius:14px}
.gallery-grid img:hover{transform:scale(1.03);border:2px solid #ffcc00}
@media(max-width:700px){nav{display:none}}
</style>
<body>
    <head>
         <header>
  <div class="logo">CHARLEY BEST<span>CARS</span> 🚗</div>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/gallery">Gallery</a>
    <a href="/contact">Contact</a>
</nav>
 </header>
    </head>
    <section class="gallery-section" id="gallery">
  <h2>Our <span>Gallery</span></h2>
  <p class="sub">Some of our latest arrivals at the stand.</p>
  <div class="gallery-grid">
    <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600">
    <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600">
    <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?w=600">
    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600">
    <img src="about/file.webp"width='600'>
   
    <img src="https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=600">
    <img src="https://images.unsplash.com/photo-1542362567-b07e54358753?w=600">
    <img src="file.webp"width="600">

  </div>
</section>
</body>
</html>
